# Lab 13 · TV1 PHẠM QUANG TUẤN · 2A202603824 · Gate 2a
# Bản tích hợp nhóm EA1125; chưa phê duyệt hoặc khởi động pilot.
# Nguồn: src/lab13.py; output report/team/TV1_ket_qua.txt.
# D1 · baseline 0,70; alpha 0,05; power 0,80; ICC 0,02:
# a) Chia theo yêu cầu, MDE 5 điểm: 1.251 yêu cầu độc lập mỗi nhóm.
# b) Theo nhân viên, m=75: DE=2,48; ceil(1.251*2,48)=3.103 yêu cầu;
#    ceil(3.103/75)=42 nhân viên mỗi nhóm, tổng 84 lớn hơn nguồn lực 40.
# c) 20 nhân viên mỗi nhóm: n hiệu dụng luôn nhỏ hơn 20/0,02=1.000, không đạt 1.251.
# d) 6 depot mỗi nhóm: n hiệu dụng luôn nhỏ hơn 6/0,02=300, chỉ có 6 cụm.
# e) MDE 6 điểm: n=859; m>=299; 20*299=5.980 yêu cầu thô mỗi nhóm;
#    DE=6,96; n hiệu dụng=859,195. Power cho hiệu ứng thật 5 điểm chỉ 0,6418.
# D2 · kiểm tra tách tác động:
# 1. 20 nhân viên đối chứng cùng thời gian, cùng phạm vi và các depot với can thiệp.
# 2. Ngẫu nhiên 20+20, phân tầng theo depot, seed=20261125; lưu danh sách trước khi chạy.
# 3. Có rủi ro chia sẻ gợi ý: giới hạn quyền theo tài khoản và log staff_id/arm/trace_id.
# 4. Chốt chỉ số, MDE, luật dừng, thời gian thu mẫu và ngày quyết định trước khởi động.
# 5. Có đúng 20 cụm nhân viên mỗi nhóm; mỗi người cần đủ 299 yêu cầu hợp lệ.
# Đánh đổi: chấp nhận MDE 6 thay cho 5 điểm, cần Giám đốc vận hành phê duyệt.
# Baseline mở lại: 51/1.200=4,25%; trong phạm vi: 39/982=3,9715%.
# Ngưỡng đề xuất: chênh >=2 điểm so đối chứng hoặc tuyệt đối >6%; không đặt trần 3%.
# Lịch dưới đây là dự kiến của bài lab, không phải cam kết triển khai thực tế.

pilot:
  status: draft_for_team_review
  author: "PHẠM QUANG TUẤN — 2A202603824 — TV1"
  contributors: ["Nguyễn Thanh Tùng — TV2", "Chu Văn Nhật — TV3", "Nguyễn Trọng Truyền — TV4"]
  owner: "Giám đốc vận hành LogiX-VN"
  max_attempts: 2
  cost_reference: >-
    CPS theo loại và A4 là số tham chiếu mẫu gốc tối đa 3 lần, không phải dự toán sau cắt 2 lần.
    Dự toán đúng phạm vi và giới hạn 2 lần ở budget_estimate; mọi chi phí có phút simulated.
  scope: >-
    Chỉ noi_dia và hang_nang tại 12 depot giả định của LogiX-VN, với 40 nhân viên
    đủ điều kiện. CPS theo loại lần lượt 2.695,64 và 8.220,74 đ (simulated).
    Loại quoc_te vì CPS 22.515,16 đ (simulated), thành công 27,33%;
    loại doi_tac vì điều khoản riêng, CPS 10.214,87 đ (simulated).
    Chỉ khởi động sau khi xác nhận đủ danh sách 40 nhân viên và quyền truy cập.
  assignment:
    unit: staff
    control_share: 0.5
    randomized: true
    seed: 20261125
    stratification: "Theo depot; cân bằng tổng 20 can thiệp và 20 đối chứng. Lưu danh sách trước khi bắt đầu."
    control: "Nhân viên tự làm theo quy trình hiện hành, không được mở trợ lý."
    persistent_control_staff: 20
    intervention_staff: 20
    enrollment: "Chọn ngẫu nhiên lồng nhau 4 rồi 10 rồi 20 người từ nhóm can thiệp; giữ nguyên đối chứng."
  rollout: [0.10, 0.25, 0.50]
  rollout_denominator: "40 nhân viên toàn công ty, tương ứng 4/10/20 nhân viên bật trợ lý."
  rollout_schedule:
    - {share: 0.10, start: "2026-11-30", end: "2026-12-13", purpose: "Kiểm tra luồng và xem lại 100%; đủ thời gian trưởng thành và 3 lần kiểm tra an toàn."}
    - {share: 0.25, start: "2026-12-14", end: "2026-12-27", purpose: "Đo phút thực tế, chờ cohort an toàn và thử giảm xem lại khi kiểm toán đạt."}
    - {share: 0.50, start: "2026-12-28", end: "2027-01-10", purpose: "Thu mẫu chính, 299 yêu cầu/người; không gộp giai đoạn làm quen."}
  schedule_rationale: >-
    Ước lượng 1.500*982/1.200=1.227,5 yêu cầu trong phạm vi mỗi ngày toàn công ty,
    khoảng 613,75 mỗi nhóm. Một tuần chỉ khoảng 4.296 yêu cầu/nhóm, chưa đủ 5.980.
    Mỗi bước dự kiến 2 tuần: bước 0.10/0.25 phải chờ cohort đủ theo dõi và 3 lần kiểm tra an toàn,
    bước 0.50 cần đủ lưu lượng. Chỉ đủ mẫu khi từng nhân viên có ít nhất 299 ca.
  schedule_policy: >-
    Các mốc là lịch dự kiến, không tự chuyển bước theo ngày. Chỉ tăng rollout khi có đủ
    cohort an toàn đã theo dõi trọn 7 ngày sau đóng và hoàn thành mọi điều kiện kiểm toán.
    Thiếu dữ liệu thì kéo dài bước hiện tại; không lấy ca chưa trưởng thành để bù mẫu.
    Nếu lịch trễ khiến không đủ mẫu trưởng thành vào ngày quyết định thì No-go mở rộng,
    trình kế hoạch thu mẫu mới; không tự dời ngày sau khi xem hiệu quả.
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    numerator: "Yêu cầu hợp lệ đóng trong 24 giờ và không mở lại trong 7 ngày."
    denominator: "Toàn bộ yêu cầu hợp lệ đã qua 8 ngày từ tiếp nhận (24 giờ để đóng và 7 ngày theo dõi), kể cả ca không đóng, theo nhóm nhân viên được phân ban đầu."
    analysis: "Theo phân nhóm ban đầu, gồm cả ca không mở trợ lý hoặc chuyển nhân viên; điều chỉnh cụm staff và tầng depot."
    sampling_policy: >-
      Mỗi nhân viên lấy đúng 299 yêu cầu hợp lệ đầu tiên theo thời gian tiếp nhận trong bước 0.50,
      lưu danh sách trước khi xem kết quả. Giữ cả ca làm thay, không đóng và không mở trợ lý.
      Ca dư vẫn theo dõi an toàn nhưng không thêm vào phân tích chính để giữ m=299 và DE=6,96.
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859                 # cỡ mẫu hiệu dụng, không phải số yêu cầu thô
    design_effect: 6.96
    clusters_per_arm: 20
    requests_per_cluster: 299
    raw_n_per_arm: 5980
    effective_n_per_arm: 859.1954022988506
    power_if_true_effect_0_05: 0.6418
    success_criterion: "Chênh can thiệp - đối chứng >=6 điểm phần trăm, CI 95% điều chỉnh cụm không chứa 0, và đạt mọi guardrail."
    maturity_date: "2027-01-18"
    maturity_rule: "Ca tiếp nhận đến hết 10/01/2027 phải qua 8 ngày; khóa dữ liệu sau 23:59 GMT+7 ngày 18/01/2027. Ca không đóng trong 24 giờ tính thất bại, không loại khỏi mẫu số."
    insufficient_sample: "Không tuyên bố hiệu quả; No-go mở rộng và lập kế hoạch thu thêm mẫu, không tự đổi MDE sau khi xem kết quả."
  identifiability:
    concurrent_control: "20 đối chứng cùng kỳ, cùng loại yêu cầu, cùng chính sách và phân tầng depot; không lấy đợt chạy thử làm đối chứng."
    spillover_risk: "Nhân viên chia sẻ gợi ý trong depot; giới hạn tài khoản, ghi staff_id/arm/trace_id và kiểm tra mỗi ngày."
    predeclared: "Chốt trước 2026-11-30: danh sách phân nhóm, seed, phạm vi, MDE, chỉ số, luật dừng, cửa sổ thu mẫu và ngày quyết định."
  safety_metric:
    name: mo_lai_trong_7_ngay
    cohort: >-
      Theo dõi mọi yêu cầu trong phạm vi của từng arm, kể cả ngoài mẫu chính.
      Chốt cohort theo ngày tiếp nhận; mỗi lần kiểm tra dùng các ngày nhận đã khóa từ trước,
      theo thứ tự thời gian, đủ ít nhất 100 yêu cầu mỗi arm và đã qua cửa sổ theo dõi.
      Không chọn bỏ ngày có ca lỗi hoặc chưa có kết quả. Yêu cầu mới thuộc cohort khác,
      được báo riêng và không làm cohort đã khóa trở thành thiếu dữ liệu.
      Đếm request duy nhất mở lại trong 7 ngày sau lần đóng đầu; chỉ phân tích cohort đã đủ theo dõi.
      Ca đóng muộn phải chờ đủ 7 ngày sau đóng. Ca chưa đóng/thiếu log báo riêng là chưa có kết quả;
      không mặc định an toàn và không được tăng rollout khi cohort đang dùng quyết định còn thiếu.
      Hoàn trùng giám sát ngay với mọi ca, không chờ trưởng thành cohort.
    required_events: [refund_request_created, ticket_closed, ticket_reopened, event_window_finalized]
  review_policy: >-
    Bước 0.10 xem lại 100%. Trưởng nhóm CSKH chỉ đề xuất giảm theo bậc 100%-50%-25%
    sau khi tỷ lệ sửa+bỏ dưới 15% và kiểm toán mẫu 100 ca/tuần không có sai tiền hoặc hoàn trùng.
    Nếu thiếu mẫu kiểm toán, giữ mức cũ và chưa tăng rollout. Ghi phút xem lại/làm lại thực tế.
  stop_rules:
    - >-
      NẾU mở lại 7 ngày của nhóm can thiệp cao hơn đối chứng ít nhất 2 điểm phần trăm
      hoặc vượt 6%, trên cohort đã đủ theo dõi với ít nhất 100 yêu cầu mỗi nhóm
      TRONG 3 lần kiểm tra hằng ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút,
      chuyển toàn bộ sang nhân viên và giao Trưởng nhóm CSKH rà nguyên nhân
      KHÔNG THÌ tiếp tục ở mức hiện tại; chưa đủ 100 ca mỗi nhóm thì không được tăng rollout.
    - >-
      NẾU phát hiện ít nhất 1 ca hoàn trùng qua đối soát sổ cái TRONG bất kỳ lần kiểm tra mỗi giờ
      THÌ Giám đốc vận hành tắt quyền hoàn phí tự động trong 30 phút và giao Kế toán trưởng đối soát
      KHÔNG THÌ tiếp tục giám sát; khi chưa đóng sự cố thì không được bật lại hoặc tăng rollout.
    - >-
      NẾU CPS biến đổi trong phạm vi, tính cả token/tool và phút người đo thật, vượt 8.000 đ
      với ít nhất 100 việc thành công mỗi tuần sau giai đoạn xem lại 100%
      TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy,
      đồng thời trình lại dự toán trong 3 ngày KHÔNG THÌ giữ phạm vi đã duyệt;
      chưa đủ dữ liệu chi phí thì không được mở thêm hang_nang.
    - >-
      NẾU tỷ lệ sửa hoặc bỏ gợi ý trên số được xem lại vượt 40%, với ít nhất 50 ca được xem lại
      TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày và sửa luồng trước khi duyệt lại
      KHÔNG THÌ tiếp tục theo dõi; chưa hoàn thành hành động hoặc thiếu mẫu thì không được chuyển bước rollout.
  interim_looks: >-
    Chỉ kiểm tra an toàn và vận hành (chi phí, sử dụng) để áp dụng luật dừng;
    không kiểm định hiệu quả chỉ số chính trước ngày quyết định.
  rollback: >-
